[window]
opacity = 1.0
padding.x = 10
padding.y = 10
decorations = "none"
decorations_theme_variant = "Light" # "Dark"

[font]
size = 9.0

[font.bold]
family = "Iosevka Nerd Font"
style = "Bold"

[font.bold_italic]
family = "Iosevka"
style = "Bold Italic"

[font.italic]
family = "Iosevka"
style = "Italic"

[font.normal]
family = "Iosevka Nerd Font"
style = "Regular"

